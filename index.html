function stars(n){return `<span class="stars">${[1,2,3].map(i=>i<=n?'★':'<span class="off">★</span>').join('')}</span>`}

function startLevel(id){
  const L=LEVELS.find(l=>l.id===id);
  P={mode:'level',id,title:L.title,steps:L.steps.map((s,i)=>({lv:id,si:i,s})),i:0,score:0,max:0,xp:0,sub:0,subScore:0};
  renderStep();
}
function startSet(mode,refs,title){P={mode,id:mode,title,steps:refs,i:0,score:0,max:0,xp:0,sub:0,subScore:0};renderStep()}
function startFinal(){startSet('final',shuffle(LEVELS.slice(1).filter(l=>!l.noPool).flatMap(l=>quizSteps(l).filter(x=>x.s.t!=='sort'))).slice(0,15),'Final table')}
function startRecall(){const pool=LEVELS.filter(l=>S.done[l.id]&&!l.noPool).flatMap(l=>quizSteps(l).filter(x=>x.s.t!=='sort'));startSet('recall',shuffle(pool).slice(0,5),'Daily recall')}
function startReview(){startSet('review',shuffle(S.review.map(findStep).filter(Boolean)).slice(0,10),'Review deck')}

function frame(inner){
  const pct=P.i/P.steps.length*100;
  app.innerHTML=`<div class="bar"><button class="x" data-go="home" aria-label="Back to levels">×</button><div class="prog"><i style="width:${pct}%"></i></div><span class="xp">+${P.xp} XP</span></div>
  <div class="step">${inner}</div>`;
}
function renderStep(){
  if(P.i>=P.steps.length)return finish();
  const {s}=P.steps[P.i];
  const head=`<span class="eyebrow">${P.title} · ${P.i+1} of ${P.steps.length}</span>`;
  if(s.t==='learn'){
    frame(`${head}<h2>${s.h}</h2><div class="prose">${fmt(s.body)}</div>${s.viz?VIZ[s.viz]():''}${s.note?`<aside class="note">${s.note}</aside>`:''}<button class="btn" id="next">Continue</button>`);
  } else if(s.t==='mcq'){
    const order=P.order=s.opts.map((_,i)=>i);
    frame(`${head}<p class="q">${fmt(s.q)}</p>${scene(s.scene)}<div class="opts">${order.map((oi,k)=>`<button class="opt" data-opt="${oi}"><span class="k">${k+1}</span><span>${fmt(s.opts[oi])}</span></button>`).join('')}</div><div id="fb"></div>`);
  } else if(s.t==='est'){
    frame(`${head}<p class="q">${fmt(s.q)}</p>${scene({you:s.you,them:s.them,board:s.board})}
     <div class="est"><label for="estin" class="muted">Your guess: how often does <b style="color:var(--felt)">your</b> hand win?</label><span class="val num" id="estv">50%</span><input type="range" id="estin" min="0" max="100" value="50"></div>
     <button class="btn" id="check">Lock in guess</button><div id="fb"></div>`);
    const inp=document.getElementById('estin');inp.oninput=()=>document.getElementById('estv').textContent=inp.value+'%';
  } else if(s.t==='num'){
    frame(`${head}<p class="q">${fmt(s.q)}</p><div class="row"><input class="numin" id="numin" type="number" inputmode="decimal" aria-label="Your answer">${s.unit?`<span class="muted">${s.unit}</span>`:''}</div><button class="btn" id="check">Check</button><div id="fb"></div>`);
    setTimeout(()=>document.getElementById('numin')?.focus(),30);
  } else if(s.t==='sort'){
    if(P.sub===0)P.subScore=0;
    const it=s.items[P.sub];
    frame(`${head}<p class="q">${s.q}</p><span class="muted num">Hand ${P.sub+1} of ${s.items.length} · ${P.subScore} right so far</span>
     <div class="sortcard">${hand(it.h)}</div><div class="sortbtns">${s.choices.map((c,i)=>`<button class="opt" data-sort="${i}"><span class="k">${i===0?'←':'→'}</span>${c}</button>`).join('')}</div><div id="fb"></div>`);
  }
}
function feedback(kind,title,why,extra=''){
  document.getElementById('fb').innerHTML=`<div class="fb ${kind}"><h3>${title}</h3><p>${fmt(why)}</p>${extra}</div><button class="btn" id="next" style="margin-top:12px">Continue</button>`;
  document.getElementById('next').focus({preventScroll:true});
  document.getElementById('next').scrollIntoView({block:'nearest',behavior:'smooth'});
}
const REF=()=>`${P.steps[P.i].lv}:${P.steps[P.i].si}`;
function grade(pts,full){ // pts 0..1
  P.max+=1;P.score+=pts;const xp=Math.round(10*pts);P.xp+=xp;S.xp+=xp;
  const ref=REF();
  if(pts<1&&!S.review.includes(ref))S.review.push(ref);
  if(pts>=1&&P.mode==='review')S.review=S.review.filter(x=>x!==ref);
  save();
}
const PRAISE=['Correct','Nice','Spot on','Exactly','Right'];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];

app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('term'))return;
  if(t.dataset.go)return go(t.dataset.go);
  if(t.id==='next'){ const s=P.steps[P.i].s; if(s.t==='sort'&&P.sub<s.items.length-1&&P.sortPending){P.sub++;P.sortPending=false;return renderStep()} P.sub=0;P.sortPending=false;P.i++;return renderStep()}
  if(t.dataset.opt!=null)return answerMcq(+t.dataset.opt);
  if(t.dataset.sort!=null)return answerSort(+t.dataset.sort);
  if(t.id==='check'){const s=P.steps[P.i].s;return s.t==='est'?answerEst():answerNum()}
});
function answerMcq(oi){
  const s=P.steps[P.i].s;if(P.answered===P.i)return;P.answered=P.i;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const o=+b.dataset.opt;if(o===s.a)b.classList.add('right');else if(o===oi)b.classList.add('wrong')});
  const ok=oi===s.a;grade(ok?1:0);
  feedback(ok?'ok':'bad',ok?praise()+' · +10 XP':'Not quite',s.why);
}
function answerEst(){
  const s=P.steps[P.i].s;if(P.answered===P.i)return;P.answered=P.i;
  const g=+document.getElementById('estin').value;document.getElementById('estin').disabled=true;document.getElementById('check').disabled=true;
  const d=Math.abs(g-s.eq[0]);const pts=d<=6?1:d<=12?.5:0;grade(pts);
  const bar=`<div style="margin-top:6px">${eqRow(s.you,s.them,s.eq[0],s.eq[1],s.board,g)}</div><p class="muted" style="font-size:.85rem">The black tick is your guess (${g}%). You were ${r(d)} points off.</p>`;
  feedback(pts===1?'ok':pts?'mid':'bad',pts===1?`${praise()} · +10 XP`:pts?'Close · +5 XP':'Off by a lot',s.why,bar);
}
function answerNum(){
  const s=P.steps[P.i].s;const v=parseFloat(document.getElementById('numin').value);if(isNaN(v))return;if(P.answered===P.i)return;P.answered=P.i;
  document.getElementById('check').disabled=true;document.getElementById('numin').disabled=true;
  const ok=Math.abs(v-s.ans)<=s.tol;grade(ok?1:0);
  feedback(ok?'ok':'bad',ok?praise()+' · +10 XP':`The answer is ${s.ans}${s.unit||''}`,s.why);
}
function answerSort(c){
  const s=P.steps[P.i].s,it=s.items[P.sub];if(P.sortPending)return;P.sortPending=true;
  document.querySelectorAll('[data-sort]').forEach(b=>{b.disabled=true;const o=+b.dataset.sort;if(o===it.a)b.classList.add('right');else if(o===c)b.classList.add('wrong')});
  const ok=c===it.a;if(ok)P.subScore++;
  const last=P.sub===s.items.length-1;
  if(last){const pts=P.subScore/s.items.length;P.max+=1;P.score+=pts;const xp=Math.round(10*s.items.length*pts/3);P.xp+=xp;S.xp+=xp;if(pts<.75&&!S.review.includes(REF()))S.review.push(REF());save()}
  feedback(ok?'ok':'bad',ok?'Right':'No, '+s.choices[it.a].toLowerCase(),it.why,last?`<p class="muted" style="font-size:.85rem">Round over: ${P.subScore} of ${s.items.length}.</p>`:'');
  if(!last)document.getElementById('next').textContent='Next hand';
}
function finish(){
  const pct=P.max?P.score/P.max:1;const st=pct>=.9?3:pct>=.7?2:1;
  bumpStreak();
  let bonus='';
  if(P.mode==='level'||P.mode==='final'){
    const prev=S.done[P.id];if(!prev){S.xp+=20;P.xp+=20;bonus='+20 XP for finishing'}
    S.done[P.id]={stars:Math.max(st,prev?.stars||0)};
  }
  save();
  const L=LEVELS.find(l=>l.id===P.id);
  const nextI=L?LEVELS.indexOf(L)+1:-1;
  app.innerHTML=`<div class="result"><span class="eyebrow">${P.title} · complete</span>
    ${P.mode==='level'||P.mode==='final'?`<div class="big-stars">${[1,2,3].map(i=>i<=st?'★':'<span class="off">★</span>').join('')}</div>`:''}
    <h2>${P.max?`${r(pct*100)}% right`:'Done'}</h2><p class="muted num">+${P.xp} XP this round${bonus?' · '+bonus:''}</p>
    ${L&&L.facts?`<div class="viz"><span class="eyebrow">Added to your cheat sheet</span><div class="facts">${L.facts.map(f=>`<div class="fact"><span class="n">${f[0]}</span><span>${f[1]}</span></div>`).join('')}</div></div>`:''}
    ${st<3&&P.mode==='level'?`<p class="muted">Get 90% for three stars. Missed questions are now in your review deck.</p>`:''}
    <div class="row">${nextI>0&&nextI<LEVELS.length?`<button class="btn" data-go="${LEVELS[nextI].id}">Next: ${LEVELS[nextI].title}</button>`:nextI===LEVELS.length&&allDone()?`<button class="btn" data-go="final">Play the final table</button>`:''}
    <button class="btn ghost" data-go="home">All levels</button></div></div>`;
}
function sheet(){
  app.innerHTML=`<button class="back" data-go="home">← All levels</button><header class="top"><span class="eyebrow">Collect them all</span><h2>Your cheat sheet</h2><p>Each finished level adds its key numbers here. Greyed-out facts are still locked.</p></header>
  ${LEVELS.map(l=>{const d=!!S.done[l.id];return `<section class="viz"><span class="eyebrow">${l.title}</span><div class="facts">${l.facts.map(f=>`<div class="fact ${d?'':'lockd'}"><span class="n">${d?f[0]:'···'}</span><span>${d?f[1]:'Finish this level to reveal'}</span></div>`).join('')}</div></section>`}).join('')}`;
}
function gloss(){
  const ks=Object.keys(G).sort((a,b)=>G[a].w.localeCompare(G[b].w));
  app.innerHTML=`<button class="back" data-go="home">← All levels</button><header class="top"><span class="eyebrow">Plain English</span><h2>Glossary</h2></header>
  <div class="gloss">${ks.map(k=>`<div><b>${G[k].w}</b><span class="muted">${G[k].d}</span></div>`).join('')}</div>`;
}
const CODE_PREFIX='MOP1:';
function exportCode(){return CODE_PREFIX+btoa(JSON.stringify(S))}
function parseCode(txt){
  try{const t=txt.trim();if(!t.startsWith(CODE_PREFIX))return null;const s=JSON.parse(atob(t.slice(CODE_PREFIX.length)));
    if(!s||typeof s.xp!=='number'||typeof s.done!=='object'||!Array.isArray(s.review))return null;
    s.streak=s.streak&&typeof s.streak.n==='number'?s.streak:{last:'',n:0};return s}catch(e){return null}
}
function sync(){
  const doneN=Object.keys(S.done).length;
  app.innerHTML=`<button class="back" data-go="home">← All levels</button>
  <header class="top"><span class="eyebrow">Phone ↔ laptop</span><h2>Move my progress</h2>
  <p>Progress is saved separately on each device. To move it, copy the code on one device and paste it on the other.</p></header>
  <section class="viz sync"><h3>1 · Copy from this device</h3>
    <p class="muted">${S.xp} XP · ${doneN} level${doneN===1?'':'s'} done · ${S.review.length} in review</p>
    <textarea class="code" id="outcode" readonly aria-label="Your progress code">${exportCode()}</textarea>
    <div class="row"><button class="btn" id="copycode">Copy code</button><span class="msg" id="copymsg"></span></div>
  </section>
  <section class="viz sync"><h3>2 · Paste on the other device</h3>
    <textarea class="code" id="incode" placeholder="Paste a code that starts with MOP1:" aria-label="Paste a progress code"></textarea>
    <div class="row"><button class="btn" id="loadcode">Load progress</button><span class="msg" id="loadmsg"></span></div>
  </section>`;
  let armed=null;
  document.getElementById('copycode').onclick=async()=>{
    const ta=document.getElementById('outcode'),m=document.getElementById('copymsg');
    try{await navigator.clipboard.writeText(ta.value);m.className='msg ok';m.textContent='Copied. Now paste it on your other device.'}
    catch(e){ta.focus();ta.select();m.className='msg';m.textContent='Code selected. Copy it with your device\'s copy command.'}
  };
  document.getElementById('incode').oninput=()=>{armed=null;document.getElementById('loadcode').textContent='Load progress';document.getElementById('loadmsg').textContent=''};
  document.getElementById('loadcode').onclick=()=>{
    const m=document.getElementById('loadmsg'),b=document.getElementById('loadcode');
    const s=parseCode(document.getElementById('incode').value);
    if(!s){m.className='msg bad';m.textContent='That code didn\'t work. Copy the whole code, starting with MOP1:';return}
    if(!armed){armed=s;m.className='msg bad';m.textContent=`This replaces this device's progress with ${s.xp} XP and ${Object.keys(s.done).length} levels done.`;b.textContent='Yes, replace it';return}
    S=armed;save();home();
  };
}
function go(where){
  window.scrollTo({top:0});
  if(where==='home')return home();
  if(where==='sync')return sync();
  if(where==='sheet')return sheet();
  if(where==='gloss')return gloss();
  if(where==='review')return startReview();
  if(where==='recall')return startRecall();
  if(where==='final')return startFinal();
  if(LEVELS.some(l=>l.id===where))return startLevel(where);
}

/* ---------- term popover ---------- */
const pop=document.getElementById('pop');
document.addEventListener('click',e=>{
  const t=e.target.closest('.term');
  if(!t){pop.hidden=true;return}
  const g=G[t.dataset.k];if(!g)return;
  pop.innerHTML=`<b>${g.w}</b>${g.d}`;pop.hidden=false;
  const rc=t.getBoundingClientRect();const w=Math.min(300,window.innerWidth-32);pop.style.maxWidth=w+'px';
  let left=rc.left+window.scrollX;left=Math.min(left,window.scrollX+window.innerWidth-w-16);left=Math.max(16,left);
  pop.style.left=left+'px';pop.style.top=(rc.bottom+window.scrollY+8)+'px';
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(!P)return;
  if(e.key==='Enter'){const b=document.getElementById('next')||document.getElementById('check');if(b&&!b.disabled){e.preventDefault();b.click()}return}
  const s=P.steps[P.i]?.s;if(!s)return;
  if(s.t==='mcq'&&/^[1-9]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click()}
  if(s.t==='sort'){if(e.key==='ArrowLeft')document.querySelector('[data-sort="0"]:not(:disabled)')?.click();if(e.key==='ArrowRight')document.querySelector('[data-sort="1"]:not(:disabled)')?.click()}
});

home();
</script>

</body>
</html>
